<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>蝶梦</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <!--
    拖动区：整个窗口可拖（Tauri 靠 data-tauri-drag-region 识别）。
    canvas 叠在上面吃掉指针，所以真正拖动由 main.js 里
    「移动 >5px → startDragging()」兜底，这个 div 保留给 Tauri 的拖拽命中。

    注意 canvas 上**不加** drag-region，否则点击小球会被当成拖动，
    「点一下开始说话」就失效了。
  -->
  <div id="drag-region" data-tauri-drag-region></div>

  <canvas id="orb" width="148" height="148"></canvas>
  <div id="caption" aria-live="polite"></div>
  <div id="hint"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
