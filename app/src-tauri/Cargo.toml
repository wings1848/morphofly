[package]
name = "morphofly-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 唤醒词是核心功能（喊「小蝶」唤醒），默认开启。
# 关闭方式：cargo build --no-default-features（纯逻辑测试用，本机缺 libstdc++ 时需要）
default = ["kws"]
kws = ["morphofly-core/kws"]

[dependencies]
# 唤醒词需要 --features kws（sherpa-onnx 静态库，本机缺 libstdc++ 时不要开）
morphofly-core = { workspace = true, features = [] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# tray-icon: 系统托盘（用户要求「支持跨平台任务栏图标」）
# image-png: 托盘图标要用 png 解码
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
