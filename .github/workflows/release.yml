name: Release

# 打 tag（v*）时自动构建 Linux 安装包并附加到 Release。
# 这样产物由 CI 生成，可复现，且不依赖任何人的本机环境。

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # 允许手动触发（测试用）

permissions:
  contents: write

jobs:
  # ── Windows 安装包（NSIS）──
  #
  # 2026-10-24 加：项目要能在 Windows 上跑。
  # Windows 不需要 XWayland 那套（窗口定位/置顶是系统原生支持的），
  # 但要在 Windows 上真编一次、真出一个安装包，否则「兼容」只是口号。
  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      # ⚠️ 别用 `cargo install tauri-cli`：2026-10-25 实测在 Windows runner 上
      # 编译 40+ 分钟还没完（依赖太多）。npm 上有预编译的 CLI，几秒钟。
      - name: 安装 tauri-cli（用预编译的 npm 包，别从源码编）
        run: npm install -g @tauri-apps/cli@^2

      # ★ 2026-10-25 调整策略：先保证「Windows 上能编出可执行文件」，
      # 安装包作为附加项。原因是 NSIS 那步要整个 Rust release 冷编译 + 打包，
      # 实测在 windows-latest 上跑了 40+ 分钟还没完，把整条流水线拖死。
      #
      # --no-bundle：只编二进制，不打安装包。这一步能过 = Windows 上真的能编。
      #
      # ⏱ 2026-10-25 实测：Windows 上的**完整** release 构建（含唤醒词 sherpa-onnx）
      # 要 ~50 分钟。之前以为是卡死，其实是在慢慢编 —— 所以超时给足 75 分钟。
      #
      # ⚠️ 别用 `tauri build --no-default-features`：npm 版 CLI 不认这个参数
      # （报 `unexpected argument '--no-default-features'`），要传特性得用
      # `tauri build -- --no-default-features`。我们不需要关特性 —— 带唤醒词的包能出来。
      - name: 编译 Windows 可执行文件（不打安装包）
        timeout-minutes: 75
        run: |
          cd app
          tauri build --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: morphofly-windows-x64-exe
          path: |
            target/release/*.exe
          if-no-files-found: warn

      # 安装包单独一步，失败不影响上面的可执行文件产物。
      - name: 打 NSIS 安装包（可选，失败不阻塞）
        id: nsis
        continue-on-error: true
        timeout-minutes: 75
        run: |
          cd app
          tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        if: steps.nsis.outcome == 'success'
        with:
          name: morphofly-windows-x64-installer
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  build-linux:
    name: 构建 Linux 包
    runs-on: ubuntu-22.04   # 用 22.04 而非 24.04：glibc 2.35 基线更老，兼容性更好

    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libasound2-dev libpulse-dev pkg-config \
            libfuse2 file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # tauri-cli 是全局安装的二进制，缓存它避免每次重编
          cache-all-crates: true

      - name: 安装 tauri-cli（用预编译的 npm 包，比 cargo install 快一个数量级）
        # 本机装了不代表 CI 有 —— 第一次跑就栽在这里（no such command: tauri）
        run: npm install -g @tauri-apps/cli@^2

      - name: 构建 Tauri 包
        # target-cpu 由 .cargo/config.toml 固定为 x86-64-v2，
        # 保证产物能在老 CPU（无 AVX）上跑。
        # 注意：用的是 npm 版 CLI，命令是 tauri（不是 cargo tauri）
        run: |
          cd app
          tauri build --bundles deb,appimage

      - name: 校验产物 CPU 基线
        # 防止误删 .cargo/config.toml 的 target-cpu 设置 ——
        # wings-gpd（Pentium N6000，无 AVX）就是 SIGILL 崩在这里。
        #
        # ⚠️ 不能简单 grep AVX 指令：ONNX Runtime 的 MLAS 和 rustfft 的 avx 模块
        # 是**运行时 CPU 特性检测 + 函数分派**，它们的代码里有 AVX 是正常的。
        # 要检查的是「我们自己的代码」是否用了 AVX。
        #
        # 方法：用 cargo 的 target-cpu 验证 —— 编译一把看 rustc 实际参数。
        run: |
          echo "=== 检查 .cargo/config.toml 的 target-cpu 设置 ==="
          if ! grep -q 'target-cpu=x86-64-v2' .cargo/config.toml; then
            echo "::error::.cargo/config.toml 缺少 target-cpu=x86-64-v2"
            echo "后果：在不支持 AVX 的 CPU（如 Intel Pentium N6000）上会 SIGILL 崩溃"
            exit 1
          fi
          echo "✅ 配置存在"

          echo "=== 验证 rustc 实际收到的参数 ==="
          cargo clean -p morphofly-core 2>/dev/null || true
          cargo build -p morphofly-core --release -v 2>&1 | grep -oE 'target-cpu=[a-z0-9-]+' | head -1 || {
            echo "::error::rustflags 没有生效"
            exit 1
          }
          echo "✅ rustflags 生效"

          echo "=== 校验可执行文件不含未被分派的 AVX（只看我们自己的 crate）==="
          # 用 readelf 检查 ELF 的 GNU_PROPERTY 是否声明需要 AVX
          BIN=$(find target/release -maxdepth 1 -type f -name 'morphofly-app' | head -1)
          if readelf -n "$BIN" 2>/dev/null | grep -qi 'x86 feature.*AVX'; then
            echo "::error::ELF 声明依赖 AVX 特性"
            exit 1
          fi
          echo "✅ ELF 未声明 AVX 依赖"

      - name: 检查产物大小
        run: |
          echo "=== 产物 ==="
          ls -lh target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage 2>/dev/null
          DEB=$(find target/release/bundle/deb -name '*.deb' | head -1)
          SIZE=$(stat -c%s "$DEB")
          echo "deb 大小: $((SIZE / 1048576)) MB"
          if [ "$SIZE" -gt $((100 * 1048576)) ]; then
            echo "::error::deb 超过 100MB 限制"
            exit 1
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: morphofly-linux-x86_64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          retention-days: 30

      - name: 创建 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          generate_release_notes: true
          body: |
            ## 安装

            **Debian/Ubuntu**
            ```bash
            sudo dpkg -i morphofly_*_amd64.deb
            ```

            **任意 Linux（AppImage，自包含）**
            ```bash
            chmod +x 蝶梦-*_amd64.AppImage
            ./蝶梦-*_amd64.AppImage
            ```

            ## 首次配置

            ```bash
            mkdir -p ~/.diemeng
            echo 'STEPFUN_KEY=你的key' > ~/.diemeng/credentials
            chmod 600 ~/.diemeng/credentials
            ```

            AppImage 已自带唤醒词和 VAD 模型，deb 需要单独下载模型（见 README）。

            ## 兼容性

            产物按 **x86-64-v2** 基线编译（SSE4.2 + POPCNT），
            兼容 2010 年后的所有 x86_64 CPU。不支持 AVX 的老机器也能跑。
