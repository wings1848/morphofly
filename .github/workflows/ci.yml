name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 纯逻辑测试（不需要音频设备/桌面）──
  test:
    name: 测试（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖（Tauri 2 + 音频）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libasound2-dev libpulse-dev pkg-config \
            ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # 唤醒词 feature 会下载 30MB 静态库，缓存它
          workspaces: ". -> target"

      - name: 格式检查
        run: cargo fmt --all -- --check

      - name: Clippy（lib + 测试，拒绝警告）
        # examples/ 是手动跑的探针脚本，允许有 clippy 风格警告；
        # 交付代码（lib + 单元测试）必须零警告。
        run: |
          cargo clippy -p morphofly-core --lib --tests -- -D warnings
          cargo clippy -p morphofly-core --examples 2>&1 | tee /tmp/clippy-ex.log
          # examples 的警告只打印不失败，但若数量暴涨要人工看

      - name: 核心测试（默认 feature）
        run: cargo test -p morphofly-core --lib --verbose

      - name: 前端测试
        # 注意：必须给 glob 或具体文件，不能只给目录 ——
        # Node 22（CI）的 --test 不接受裸目录，会 MODULE_NOT_FOUND；
        # Node 26（本地）能自动发现。写 glob 两边都能跑。
        run: |
          node --version
          node --test 'app/frontend/test/*.test.mjs'

  # ── 唤醒词测试（单独 job，因为要拉 sherpa-onnx 静态库）──
  test-kws:
    name: 测试（含唤醒词）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libpulse-dev pkg-config ffmpeg

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # ★ 2026-10-24 修：这个 job 之前一直红，报
      #   `could not find native static library sherpa-onnx-c-api`
      #
      # 原因：sherpa-onnx-sys 的 build.rs 把预编译库缓存在
      # target/sherpa-onnx-prebuilt/，而 rust-cache 会把 target/ 一起缓存。
      # 恢复出来可能是「有目录没库文件」的半残状态，build.rs 看到缓存就不再下载，
      # 于是链接期找不到 .a。清掉让它重新下载。
      - name: 清掉 sherpa 预编译缓存（半残缓存会导致链接失败）
        run: rm -rf target/sherpa-onnx-prebuilt

      - name: 唤醒词测试
        run: cargo test -p morphofly-core --features kws --lib

      - name: 诊断（失败时可看出库到底在不在）
        if: failure()
        run: |
          echo "--- target/sherpa-onnx-prebuilt ---"
          find target/sherpa-onnx-prebuilt -maxdepth 3 2>/dev/null | head -40
          echo "--- 静态库 ---"
          find target/sherpa-onnx-prebuilt -name '*.a' 2>/dev/null | head -20

  # ── Windows 编译闸门（2026-10-24 加）──
  #
  # 为什么单独一个 job：这个项目是在 Linux 上开发、在 Linux 上测的，
  # Windows 兼容没法靠「看代码觉得没问题」证明 —— 必须真编一次。
  # 最容易坏的三处（都已踩过）：
  #   1. 数据目录只读 HOME（Windows 只有 USERPROFILE）
  #   2. 拉起 dsh 时 Command::new("dsh") 找不到 npm 生成的 dsh.cmd
  #   3. 平台专用代码（cpal 的 pulseaudio 后端、GDK_BACKEND 那套）
  #      没有 cfg 隔离，在 Windows 上直接编译失败
  build-windows:
    name: 构建检查（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: core（默认 features，纯逻辑）
        timeout-minutes: 15
        run: cargo check -p morphofly-core

      - name: core 单元测试（跨平台逻辑，不碰音频设备）
        # 加超时：2026-10-25 有过一次挂 40 分钟的黑历史
        # （cmd /C 兜底让不存在的命令也能 spawn，测试等不到错误就干等）
        timeout-minutes: 15
        run: cargo test -p morphofly-core --lib

      - name: app 外壳（先关掉唤醒词，保证基础能编）
        timeout-minutes: 25
        run: cargo check -p morphofly-app --no-default-features

      # 唤醒词（sherpa-onnx）在 Windows 上要下预编译静态库，单独试；
      # 失败了不让整个 CI 红，但能看出是不是这条路坏了。
      - name: app 外壳（含唤醒词，允许失败）
        continue-on-error: true
        run: cargo check -p morphofly-app

  # ── 密钥扫描（防止误提交）──
  secret-scan:
    name: 密钥扫描
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 全历史，扫历史里的泄漏

      - name: 扫 StepFun key 模式
        run: |
          # StepFun key 形如 1HeA...gBHe（65 字符）
          if git log --all -p | grep -qE '1HeA[A-Za-z0-9]{50,}'; then
            echo "::error::发现疑似 StepFun API key 泄漏"
            exit 1
          fi
          echo "✅ 未发现密钥"

      - name: 扫通用密钥模式
        run: |
          PATTERNS='(sk-[A-Za-z0-9]{32,}|ghp_[A-Za-z0-9]{36}|AKIA[0-9A-Z]{16})'
          if git log --all -p | grep -qE "$PATTERNS"; then
            echo "::error::发现疑似 API key / token"
            exit 1
          fi
          echo "✅ 未发现通用密钥模式"

  # ── 构建检查（确保 Tauri 壳能编译）──
  build:
    name: 构建检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libasound2-dev libpulse-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译 core（默认 feature）
        run: cargo build -p morphofly-core --release

      - name: 编译 core（含唤醒词）
        run: cargo build -p morphofly-core --features kws --release

  # ── 构建 Linux 应用并上传产物（真机测试用这个二进制，不在本机编译）──
  #
  # 为什么单独一个 job：用户明确「编译走 GitHub Actions」。
  # 真机（wings-gpd 掌机）CPU 弱，本地编一次要 5–13 分钟且会卡住正在跑的
  # app/chrome；改成 CI 编、这里只负责下载+部署（tools/gpd_deploy_ci.sh）。
  build-app-linux:
    name: 构建 Linux 应用（可下载产物）
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libasound2-dev libpulse-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 编译 app（默认 features，含唤醒词）
        run: cargo build --release -p morphofly-app

      - name: 打产物包（二进制 + 随包资源 + 版本标记）
        run: |
          set -euo pipefail
          rm -rf ci-dist && mkdir -p ci-dist
          cp target/release/morphofly-app ci-dist/
          cp -r app/src-tauri/resources ci-dist/resources
          printf 'sha=%s\nbuilt=%s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            > ci-dist/build.txt
          tar -C ci-dist -czf morphofly-app-linux-x64.tar.gz .
          ls -lh morphofly-app-linux-x64.tar.gz
          cat ci-dist/build.txt

      - uses: actions/upload-artifact@v4
        with:
          name: morphofly-app-linux-x64
          path: morphofly-app-linux-x64.tar.gz
          retention-days: 14
