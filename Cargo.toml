[workspace]
resolver = "2"
members = ["core", "app/src-tauri"]
default-members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.91 是 sonora 0.2（纯 Rust AEC3 移植）的最低要求，见下面 workspace.dependencies 的 sonora。
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
base64 = "0.23"
# Linux 上加 pipewire/pulseaudio 后端：ALSA 走 PipeWire 桥接在某些设备上
# 会报 "Unable to create stream: No such entity"（实测 wings-gpd 的 SOF 声卡），
# 直接用原生后端能绕开。
cpal = { version = "0.18", features = ["pulseaudio"] }
rodio = "0.23"
realfft = "3.5"
hound = "3.5"
bytes = "1"
# 回声消除（AEC3）：WebRTC Audio Processing 的纯 Rust 移植。
# 选它而不是 webrtc-audio-processing：后者要 clang/meson/ninja，本机（Debian 云主机）没有。
sonora = "0.2"
morphofly-core = { path = "core" }
