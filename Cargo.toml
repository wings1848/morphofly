[workspace]
resolver = "2"
members = ["core", "app/src-tauri"]
default-members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.23"
cpal = "0.18"
rodio = "0.23"
realfft = "3.5"
hound = "3.5"
bytes = "1"
diemeng-core = { path = "core" }
